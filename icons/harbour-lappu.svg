<?xml version="1.0" encoding="UTF-8"?>
<!-- The leaf outline is the launcher shape from the Jolla Sailfish Apps icon
     template (icon-launcher-template.svg), CC BY 3.0. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="512" height="512" viewBox="0 0 86 86">
  <defs>
    <path id="leaf" d="M84.277,0.3H43C19.417,0.3,0.3,19.418,0.3,43v41.277c0,0.786,0.637,1.423,1.423,1.423H43c23.583,0,42.7-19.118,42.7-42.7V1.723C85.7,0.937,85.063,0.3,84.277,0.3z"/>

    <!-- Indigo, hue 224, dark at the blunt corner and lighter towards the
         point, along the diagonal the template gradients use. Askare takes
         Nextcloud's own blue, so this sits beside it rather than on it. -->
    <linearGradient id="body" gradientUnits="userSpaceOnUse"
                    x1="0.7169" y1="85.2831" x2="85.2831" y2="0.7169">
      <stop offset="0" stop-color="#00258c"/>
      <stop offset="1" stop-color="#1a50e6"/>
    </linearGradient>

    <!-- A note sheet on a 104 x 128 box, so its centre is at 52,64. The
         top-right corner is cut on the diagonal, which is what reads as a
         turned-down fold. -->
    <path id="sheet" d="M0,0H72L104,32V128H0Z"/>

    <!-- The written lines are cut out rather than drawn, so the sheet keeps
         reading as one piece of paper. The last line is short, the way a last
         line is. -->
    <mask id="lines" maskUnits="userSpaceOnUse" x="-10" y="-10" width="124" height="148">
      <rect x="-10" y="-10" width="124" height="148" fill="#ffffff"/>
      <path d="M20,60H84" stroke="#000000" stroke-width="12"/>
      <path d="M20,86H84" stroke="#000000" stroke-width="12"/>
      <path d="M20,112H60" stroke="#000000" stroke-width="12"/>
    </mask>
  </defs>

  <use xlink:href="#leaf" fill="url(#body)"/>

  <!-- 52,64 of the sheet lands on 43,43 of the icon. The sheet is portrait, so
       it is scaled to about the height the sibling apps give their glyphs
       rather than to their width. Named, so that the cover glyph can be
       exported from this one sheet instead of a second copy of the geometry. -->
  <g id="glyph" transform="translate(23.5 19) scale(0.375)">
    <g mask="url(#lines)">
      <use xlink:href="#sheet" fill="#ffffff"/>
    </g>
  </g>
</svg>
